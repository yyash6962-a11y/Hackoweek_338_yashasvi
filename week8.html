<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    margin: 20px;
}

/* Gallery Grid */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* Lightbox */
.lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.lightbox img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 10px;
}

/* Buttons */
.close, .prev, .next {
    position: absolute;
    color: white;
    font-size: 30px;
    cursor: pointer;
    padding: 10px;
}

.close {
    top: 20px;
    right: 30px;
}

.prev {
    left: 20px;
    top: 50%;
}

.next {
    right: 20px;
    top: 50%;
}
</style>

</head>

<body>

<h1>Yashasvi's Photo Gallery 📸</h1>

<div class="gallery">
<img src="https://source.unsplash.com/400x300?nature" onclick="openLightbox(0)">
<img src="https://source.unsplash.com/400x301?travel" onclick="openLightbox(1)">
<img src="https://source.unsplash.com/400x302?city" onclick="openLightbox(2)">
<img src="https://source.unsplash.com/400x303?mountain" onclick="openLightbox(3)">
<img src="https://source.unsplash.com/400x304?beach" onclick="openLightbox(4)">
<img src="https://source.unsplash.com/400x305?forest" onclick="openLightbox(5)">
<img src="https://source.unsplash.com/400x306?sunset" onclick="openLightbox(6)">
<img src="https://source.unsplash.com/400x307?night" onclick="openLightbox(7)">
<img src="https://source.unsplash.com/400x308?sky" onclick="openLightbox(8)">
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<span class="prev" onclick="changeImage(-1)">❮</span>
<img id="lightbox-img">
<span class="next" onclick="changeImage(1)">❯</span>
</div>

<script>
let images = [
"https://source.unsplash.com/800x600?nature",
"https://source.unsplash.com/800x601?travel",
"https://source.unsplash.com/800x602?city",
"https://source.unsplash.com/800x603?mountain",
"https://source.unsplash.com/800x604?beach",
"https://source.unsplash.com/800x605?forest",
"https://source.unsplash.com/800x606?sunset",
"https://source.unsplash.com/800x607?night",
"https://source.unsplash.com/800x608?sky"
];

let currentIndex = 0;

function openLightbox(index) {
    currentIndex = index;
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = images[index];
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

function changeImage(direction) {
    currentIndex += direction;

    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;

    document.getElementById("lightbox-img").src = images[currentIndex];
}
</script>

</body>
</html>
