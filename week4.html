<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Listing</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.card{
    background:white;
    width:200px;
    margin:15px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}

.price{
    color:green;
    font-weight:bold;
}

button{
    background:#e67e22;
    color:white;
    border:none;
    padding:10px;
    margin-top:10px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#d35400;
}

footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:10px;
}
</style>

</head>

<body>

<header>
<h1>Yashasvi Store</h1>
<p>1st Year CSE BTech | Online Shop</p>
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Headphones</h3>
<p class="price">₹999</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Smart Watch</h3>
<p class="price">₹1499</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Mobile Cover</h3>
<p class="price">₹299</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Bluetooth Speaker</h3>
<p class="price">₹1199</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Laptop Bag</h3>
<p class="price">₹799</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200" alt="">
<h3>Power Bank</h3>
<p class="price">₹899</p>
<button>Buy Now</button>
</div>

</div>

<footer>
<p>© 2026 Yashasvi Yadav | Product Page</p>
</footer>

</body>
</html>
