<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #43cea2, #185a9d);
    margin: 0;
}

.container {
    max-width: 500px;
    margin: 60px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
}

input {
    width: 70%;
    padding: 10px;
}

button {
    padding: 10px;
    background: #43cea2;
    border: none;
    color: white;
    cursor: pointer;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #f4f4f4;
    margin: 10px 0;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    border-radius: 5px;
}

.completed {
    text-decoration: line-through;
    color: gray;
}

.delete-btn {
    background: red;
    color: white;
    border: none;
    cursor: pointer;
    padding: 5px 10px;
}
</style>

</head>

<body>

<div class="container">
<h1>To-Do List</h1>
<p><b>Yashasvi Yadav</b> | 1st Year CSE BTech</p>

<input type="text" id="taskInput" placeholder="Enter a task...">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

</div>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if(task === "") {
        alert("Please enter a task!");
        return;
    }

    let li = document.createElement("li");
    li.innerHTML = task;

    // Mark complete
    li.onclick = function() {
        li.classList.toggle("completed");
    };

    // Delete button
    let delBtn = document.createElement("button");
    delBtn.innerHTML = "X";
    delBtn.className = "delete-btn";

    delBtn.onclick = function(e) {
        e.stopPropagation();
        li.remove();
    };

    li.appendChild(delBtn);
    document.getElementById("taskList").appendChild(li);

    input.value = "";
}
</script>

</body>
</html>
